name: Render Video Khanatoon

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Pilih Resolusi Render'
        required: true
        default: '1.0'
        type: choice
        options:
          - '1.0'
          - '0.5'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install NPM Dependencies
        run: npm install

      - name: Render Video
        run: |
          SCALE="${{ github.event.inputs.scale || '1.0' }}"
          mkdir -p out
          echo "Memulai render dengan scale: $SCALE"
          if [ "$SCALE" = "0.5" ]; then
            npx remotion render src/index.ts BridgeShortCaptioned out/raw.mp4 --scale=0.5 --codec=h264 --crf=16 --gl=swangle --concurrency=2 --timeout=300000
            ffmpeg -y -i out/raw.mp4 -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -crf 16 -c:a copy out/video.mp4
          else
            npx remotion render src/index.ts BridgeShortCaptioned out/video.mp4 --codec=h264 --crf=16 --gl=swangle --concurrency=2 --timeout=300000
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-khanatoon-muna
          path: out/video.mp4
          retention-days: 7
